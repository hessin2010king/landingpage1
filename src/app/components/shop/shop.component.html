<section class="shop">
  <h2>ALL COLLECTIONS YOU NEED</h2>
  <div class="category-grid">
    <div class="category-card" *ngFor="let category of categories">
      <div class="image-container">
        <img [src]="category.image" [alt]="category.name">
      </div>
      <h3>{{ category.name }}</h3>
    </div>
  </div>
</section>
